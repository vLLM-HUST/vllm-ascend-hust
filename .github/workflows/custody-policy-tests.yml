name: Custody policy tests
on:
  pull_request:
permissions:
  contents: read
jobs:
  policy-tests:
    name: Custody policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vLLM-HUST/.github
          ref: ceaba13bc55210e8c66f44b3cc4a620ed5acaed9
          persist-credentials: false
      - run: python -m unittest discover -s tests -p test_benchmark_data_policy.py -v
