# Managed template: vLLM-HUST/.github, workflow-templates/hust-upstream-sync.yml.
# Preserve each caller's staggered schedule when copying this file.
name: Daily upstream sync

on:
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync default branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve fork metadata and validate target
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          APP_CLIENT_ID: ${{ vars.UPSTREAM_SYNC_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.UPSTREAM_SYNC_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$APP_CLIENT_ID" && -z "$APP_PRIVATE_KEY" || -z "$APP_CLIENT_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "::error::Configure both UPSTREAM_SYNC_APP_CLIENT_ID and UPSTREAM_SYNC_APP_PRIVATE_KEY."
            exit 1
          fi
          metadata="$(gh api "repos/${GITHUB_REPOSITORY}")"
          branch="$(jq -r '.default_branch' <<< "$metadata")"
          upstream_repo="$(jq -r '.parent.full_name // empty' <<< "$metadata")"
          if [[ -z "$upstream_repo" || "$GITHUB_REF_NAME" != "$branch" ]]; then
            echo "::error::Synchronization requires a fork and its default branch; refusing another target."
            exit 1
          fi
          upstream_branch="$(gh api "repos/${upstream_repo}" --jq '.default_branch')"
          {
            echo "repository=$upstream_repo"
            echo "branch=$upstream_branch"
            echo "target=$branch"
          } >> "$GITHUB_OUTPUT"

      - name: Create repository-scoped sync token
        id: app-token
        if: vars.UPSTREAM_SYNC_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.UPSTREAM_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.UPSTREAM_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Merge official upstream and verify ancestry
        id: merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          HAS_SYNC_CREDENTIAL: ${{ steps.app-token.outputs.token != '' || secrets.UPSTREAM_SYNC_TOKEN != '' }}
          UPSTREAM_REPOSITORY: ${{ steps.upstream.outputs.repository }}
          UPSTREAM_BRANCH: ${{ steps.upstream.outputs.branch }}
          TARGET_BRANCH: ${{ steps.upstream.outputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          echo "has-sync-credential=$HAS_SYNC_CREDENTIAL" >> "$GITHUB_OUTPUT"
          if [[ "$HAS_SYNC_CREDENTIAL" != "true" ]]; then
            echo "::warning::GITHUB_TOKEN cannot synchronize changed workflow files. Configure the dedicated sync App or UPSTREAM_SYNC_TOKEN; a no-op success does not prove that permission."
          fi
          before="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TARGET_BRANCH}" --jq '.sha')"
          upstream="$(gh api "repos/${UPSTREAM_REPOSITORY}/commits/${UPSTREAM_BRANCH}" --jq '.sha')"
          # shellcheck disable=SC2016
          printf 'Target before: `%s`\nUpstream observed: `%s`\n' "$before" "$upstream" >> "$GITHUB_STEP_SUMMARY"
          relation="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${upstream}...${before}" --jq '.status')"
          if [[ "$relation" == ahead || "$relation" == identical ]]; then
            # shellcheck disable=SC2016
            printf '\nNo-op: target `%s` already contains the observed upstream commit; no write requested.\n' "$before" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          response="$(mktemp)"
          failure="$(mktemp)"
          trap 'rm -f "$response" "$failure"' EXIT
          # Pin the observed upstream SHA; preserve the old GITHUB_TOKEN behavior
          # of not launching imported hardware/release CI from a synchronization.
          if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/merges" \
            -f base="$TARGET_BRANCH" -f head="$upstream" \
            -f commit_message="chore: sync ${UPSTREAM_REPOSITORY}@${upstream} [skip ci]" \
            > "$response" 2> "$failure"; then
            reason="$(<"$failure")"
            case "$reason" in
              *"HTTP 409"*) kind=merge-conflict; hint="Resolve the conflict in an isolated checkout, preserving fork-only commits. Never force-sync." ;;
              *"HTTP 422"*workflow*|*workflow*"HTTP 422"*) kind=workflow-permission; hint="The merge token must have Contents and Workflows write permissions. GITHUB_TOKEN contents:write alone is insufficient." ;;
              *"HTTP 401"*|*"HTTP 403"*) kind=authentication; hint="Check sync credential expiry, installation scope, SSO and repository rules." ;;
              *) kind=api-error; hint="Inspect the API error and retry only after distinguishing a transient failure from a conflict." ;;
            esac
            echo "failure-kind=$kind" >> "$GITHUB_OUTPUT"
            printf '::error::Upstream sync failed (%s). %s\n' "$kind" "$hint"
            printf '%s\n' "$reason" >&2
            printf '\nFailure: **%s**. %s\n' "$kind" "$hint" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ -s "$response" ]]; then
            jq -r '.commit.message' "$response" >> "$GITHUB_STEP_SUMMARY"
            merged="$(jq -er '.sha' "$response")"
          else
            echo "Already contains the observed upstream commit (HTTP 204)." >> "$GITHUB_STEP_SUMMARY"
            merged="$before"
          fi
          # shellcheck disable=SC2016
          printf '\nMerge response SHA: `%s`\n' "$merged" >> "$GITHUB_STEP_SUMMARY"
          # Branch reads can briefly lag a successful merge. Retry reads, never
          # the mutation, and still fail closed if ancestry does not converge.
          verified=false
          for attempt in 1 2 3 4 5; do
            after="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TARGET_BRANCH}" -H 'Cache-Control: no-cache' --jq '.sha')"
            verified=true
            for ancestor in "$before" "$upstream" "$merged"; do
              status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${ancestor}...${after}" -H 'Cache-Control: no-cache' --jq '.status')"
              if [[ "$status" != ahead && "$status" != identical ]]; then
                verified=false
                break
              fi
            done
            [[ "$verified" == true ]] && break
            if [[ "$attempt" != 5 ]]; then
              echo "Waiting for branch/compare consistency ($attempt/5); merge SHA $merged."
              sleep 2
            fi
          done
          if [[ "$verified" != true ]]; then
            echo "failure-kind=ancestry-verification" >> "$GITHUB_OUTPUT"
            echo "::error::Post-merge ancestry verification failed for $ancestor ($status); branch $after, merge $merged."
            exit 1
          fi
          # shellcheck disable=SC2016
          printf '\nTarget after: `%s`\nBoth previous fork HEAD and observed upstream HEAD are ancestors.\n' "$after" >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPOSITORY: ${{ steps.upstream.outputs.repository }}
          UPSTREAM_BRANCH: ${{ steps.upstream.outputs.branch }}
          FAILURE_KIND: ${{ steps.merge.outputs.failure-kind || 'configuration-or-api' }}
        shell: bash
        run: |
          set -euo pipefail
          title="[Automation] Daily upstream sync failed"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          issue_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$title in:title" --json number,title \
            --jq '.[] | select(.title == "[Automation] Daily upstream sync failed") | .number' | head -n 1)"
          body="$(mktemp)"
          stored="$(mktemp)"
          trap 'rm -f "$body" "$stored"' EXIT
          # shellcheck disable=SC2016
          printf 'Daily synchronization from `%s:%s` into `%s:%s` failed.\n\nFailure class: **%s**\n\nRun: %s\n\nSee the run summary for exact source SHAs and diagnosis. Workflow updates require a dedicated App/Token with Contents and Workflows write access. Conflicts must be resolved without discarding fork-only commits.\n' \
            "${UPSTREAM_REPOSITORY:-unknown}" "${UPSTREAM_BRANCH:-unknown}" \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$FAILURE_KIND" "$run_url" > "$body"
          if [[ -n "$issue_number" ]]; then
            url="$(gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body-file "$body")"
            gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${url##*issuecomment-}" | jq -j '.body' > "$stored"
          else
            url="$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body" --assignee ShuhaoZhangTony)"
            gh api "repos/${GITHUB_REPOSITORY}/issues/${url##*/}" | jq -j '.body' > "$stored"
          fi
          cmp "$body" "$stored"

      - name: Send optional Slack failure notification
        if: failure()
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FAILURE_KIND: ${{ steps.merge.outputs.failure-kind || 'configuration-or-api' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SLACK_WEBHOOK_URL:-}" ]]; then
            echo "No Slack webhook configured; the original failure remains in the run and GitHub issue."
            exit 0
          fi
          jq -n --arg text "Upstream sync failed ($FAILURE_KIND): $GITHUB_REPOSITORY. https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{text: $text}' |
            curl --fail --silent --show-error --max-time 20 --header "Content-Type: application/json" --data @- "$SLACK_WEBHOOK_URL"

      - name: Close recovered failure issue
        if: success() && steps.merge.outputs.has-sync-credential == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="[Automation] Daily upstream sync failed"
          issue_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$title in:title" --json number,title \
            --jq '.[] | select(.title == "[Automation] Daily upstream sync failed") | .number' | head -n 1)"
          if [[ -n "$issue_number" ]]; then
            # No-op runs using GITHUB_TOKEN must not falsely close a missing-credential incident.
            gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY"
          fi
